apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: test
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: test
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: main
      labels:
        app.kubernetes.io/instance: test
    spec:
      initContainers:
      - name: spike
        command:
        - /bin/sh
        args:
        - -c
        - |
          cp -a /usr/local/bin/spike /pilot
        image: ghcr.io/spiffe/spike-pilot:dev
        imagePullPolicy: Never
        volumeMounts:
        - name: pilot
          mountPath: /pilot
      containers:
      - command:
        - /bin/bash
        args:
        - -c
        - |
          yum install -y tar gzip
          cd /tmp
          # Pick release assets for the pod's own architecture so this
          # harness runs on amd64 CI runners and arm64 developer boxes alike.
          case "$(uname -m)" in
            x86_64)  MC_ARCH=amd64; HELPER_ARCH=x86_64; SH_ARCH=x86_64 ;;
            aarch64) MC_ARCH=arm64; HELPER_ARCH=arm64;  SH_ARCH=arm64 ;;
            *) echo "unsupported architecture: $(uname -m)"; exit 1 ;;
          esac
          GH=https://github.com/spiffe
          AWS_REL="${GH}/aws-spiffe-workload-helper/releases/download/v0.0.4"
          AWS_ASSET="aws-spiffe-workload-helper_Linux_${HELPER_ARCH}.tar.gz"
          SH_REL="${GH}/spiffe-helper/releases/download/v0.10.0"
          SH_ASSET="spiffe-helper_v0.10.0_Linux-${SH_ARCH}.tar.gz"
          curl "https://dl.min.io/client/mc/release/linux-${MC_ARCH}/mc" \
            -o /bin/mc
          curl -L "${AWS_REL}/${AWS_ASSET}" -o /tmp/aws-helper.tgz
          curl -L "${SH_REL}/${SH_ASSET}" -o helper.tgz
          tar -xvf aws-helper.tgz
          tar -xvf helper.tgz
          chmod +x /bin/mc
          mkdir -p /tmp/creds
          mkdir -p ~/.aws
          cat > ~/.aws/config <<EOF
          [default]
          credential_process = /tmp/aws-spiffe-workload-helper jwt-credential-process --role-arn arn:minio:iam:::role/MHR2BeH2-q1dHO2yx5U9Mf-tP9Q --audience minio --endpoint http://minio.minio:9000 --workload-api-addr unix:/spiffe-workload-api/spire-agent.sock --hint minio
          EOF
          cat > /tmp/helper.conf <<EOF
          agent_address = "/spiffe-workload-api/spire-agent.sock"
          cmd = ""
          cmd_args = ""
          cert_dir = "/tmp/creds"
          renew_signal = ""
          svid_file_name = "tls.crt"
          svid_key_file_name = "tls.key"
          svid_bundle_file_name = "ca.pem"
          daemon_mode = false
          hint = "spike"
          EOF
          touch /tmp/ready
          while true; do sleep 1000; done
        name: main
        readinessProbe:
          exec:
            command:
            - cat
            - /tmp/ready
        env:
        - name: SPIKE_NEXUS_API_URL
          value: https://spire-spike-nexus.spire-server:443
        - name: SPIFFE_ENDPOINT_SOCKET
          value: "unix:///spiffe-workload-api/spire-agent.sock"
        - name: SPIKE_SYSTEM_LOG_LEVEL
          value: debug
        - name: SPIKE_TRUST_ROOT
          value: example.org
        - name: SPIKE_TRUST_ROOT_NEXUS
          value: example.org
        image: amazon/aws-cli:latest
        imagePullPolicy: IfNotPresent
        volumeMounts:
        - mountPath: /spiffe-workload-api
          name: spiffe-workload-api
          readOnly: true
        - name: pilot
          mountPath: /usr/local/bin/spike
          subPath: spike
          readOnly: true
      volumes:
      - name: pilot
        emptyDir: {}
      - csi:
          driver: csi.spiffe.io
          readOnly: true
        name: spiffe-workload-api
