# Since chart 0.30.0 the OIDC discovery provider advertises a fixed JWT
# issuer (default https://oidc-discovery.<trust domain>), and its discovery
# document points jwks_uri at that host. Nothing inside the cluster resolves
# it, so MinIO's provisioning ("mc idp openid add") cannot fetch the signing
# keys and fails. Pinning the issuer to the in-cluster provider URL makes
# the token issuer, the discovery issuer and the keys endpoint agree; the
# provider allows the http scheme (allow_insecure_scheme is on by default).
global:
  spire:
    jwtIssuer: http://spire-spiffe-oidc-discovery-provider.spire-server

spire-server:
  enabled: true
  controllerManager:
    enabled: true
    identities:
      clusterSPIFFEIDs:
        # Since chart 0.30.x the SPIKE identities are not enabled by default;
        # without these, Nexus, Keeper, Pilot and the bootstrap hook get no
        # SVID and never come up.
        spike-nexus:
          enabled: true
        spike-keeper:
          enabled: true
        spike-pilot:
          enabled: true
        spike-bootstrap:
          enabled: true
        test-spike-lite:
          labels:
            app.kubernetes.io/instance: test
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
          spiffeIDTemplate: spiffe://{{ .TrustDomain }}/spike/workload/role/lite
          hint: spike
        test-minio:
          labels:
            app.kubernetes.io/instance: test
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
          spiffeIDTemplate: spiffe://{{ .TrustDomain }}/minio/data-test-rw
          hint: minio
  credentialComposer:
    cel:
      enabled: true
      jwt:
        expression: |
          spire.plugin.server.credentialcomposer.v1
            .ComposeWorkloadJWTSVIDResponse{
            attributes: spire.plugin.server.credentialcomposer.v1
              .JWTSVIDAttributes{
              claims: request.attributes.claims.mapOverrideEntries(
                request.spiffe_id.startsWith(
                  spiffe_trust_domain + "/minio/")?
                  {'groups': [request.spiffe_id.substring(
                    spiffe_trust_domain.size() + 7)]}:
                  {}
              )
            }
          }

spiffe-oidc-discovery-provider:
  enabled: true
  tls:
    spire:
      enabled: false

spike-pilot:
  enabled: true
  image:
    pullPolicy: Never
    tag: dev
  shell:
    image:
      registry: quay.io
      repository: almalinuxorg/almalinux
      tag: "10"

spike-keeper:
  enabled: true
  image:
    pullPolicy: Never
    tag: dev

spike-nexus:
  enabled: true
  image:
    pullPolicy: Never
    tag: dev
  backendStore: lite
  # The chart's post-install bootstrap hook runs this image; it is the dev
  # build loaded into kind, so the bootstrap image is under test too.
  bootstrap:
    image:
      pullPolicy: Never
      tag: dev
